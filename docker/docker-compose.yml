version: "3.9"
services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
  
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: shavira_kb
      POSTGRES_USER: shavira
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shavira123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
  
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
volumes:
  qdrant_data:
  postgres_data:
